<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; media-src * blob: data:; connect-src 'self' https: http://127.0.0.1:*; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Maxen</title><link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <button class="brand" data-nav="home"><span class="brandMark">M</span><span>MAXEN</span></button>
    <nav><button data-nav="home" class="active">Keşfet</button><button data-nav="movie">Filmler</button><button data-nav="tv">Diziler</button><button data-nav="list">Listem</button></nav>
    <form id="searchForm"><span class="searchIcon">⌕</span><input id="query" autocomplete="off" placeholder="Başlık, tür veya oyuncu ara"><kbd>Ctrl K</kbd><button aria-label="Ara">Ara</button></form>
    <div class="profile" title="Yerel profil">A</div>
  </header>
  <main id="app"><div class="loading"><i></i><span>Maxen hazırlanıyor</span></div></main>

  <section id="detail" class="detailPage" hidden><button class="close" data-close aria-label="Geri">←</button><div id="detailBody"></div></section>
  <section id="player" hidden>
    <video id="video" autoplay playsinline></video>
    <div class="playerTop"><button id="back" aria-label="Geri"><svg viewBox="0 0 24 24"><path d="M15.5 19 8.5 12l7-7"/></svg></button></div>
    <button id="centerPlay" class="centerPlay" aria-label="Oynat veya duraklat"><svg class="playIcon" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></svg><svg class="pauseIcon" viewBox="0 0 24 24"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg></button>
    <div class="playerControls">
      <div class="timeline"><span id="currentTime">00:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Video konumu"><span id="duration">00:00</span></div>
      <div class="controlBar">
        <div class="controlGroup"><button id="playToggle" aria-label="Oynat"><svg class="playIcon" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></svg><svg class="pauseIcon" viewBox="0 0 24 24"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg></button><button id="rewind" aria-label="10 saniye geri"><svg viewBox="0 0 28 28"><path d="M9 8H4V3M4.5 8.5A11 11 0 1 1 3 17"/><text x="9" y="18">10</text></svg></button><button id="forward" aria-label="10 saniye ileri"><svg viewBox="0 0 28 28"><path d="M19 8h5V3m-.5 5.5A11 11 0 1 0 25 17"/><text x="9" y="18">10</text></svg></button><button id="mute" aria-label="Sesi kapat"><svg class="soundOn" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10zm12-2a6 6 0 0 1 0 8m2-11a10 10 0 0 1 0 14"/></svg><svg class="soundOff" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10zm12-1 5 6m0-6-5 6"/></svg></button><input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Ses seviyesi"></div>
        <div class="nowPlaying"><strong id="playerTitle"></strong><span id="playerMeta"></span></div>
        <div class="playerActions"><button id="nextEpisode" aria-label="Sonraki bölüm"><svg viewBox="0 0 24 24"><path d="m6 5 10 7-10 7zm11 0h2v14h-2z"/></svg></button><button id="episodeMenu" aria-label="Bölümler"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button><button id="settingsToggle" aria-label="Ses ve görüntü ayarları"><svg viewBox="0 0 24 24"><path d="M4 5h16v12H9l-5 3zm4 5h.01M12 10h.01M16 10h.01"/></svg></button><button id="fullscreen" aria-label="Tam ekran"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M8 21H3v-5m13 5h5v-5"/></svg></button></div>
      </div>
      <div id="settingsPanel" class="settingsPanel" hidden><div><span>SES</span><select id="source"><option value="original">Orijinal yayın</option></select></div><div><span>GÖRÜNTÜ KALİTESİ</span><select id="quality"><option value="-1">Otomatik</option></select></div></div>
    </div>
    <aside id="episodePanel" class="episodePanel" hidden>
      <div class="episodePanelHead"><div><span>BÖLÜMLER</span><strong id="episodePanelTitle"></strong></div><select id="playerSeasonSelect" aria-label="Sezon seç"></select><button id="closeEpisodePanel" aria-label="Bölümleri kapat">×</button></div>
      <div id="playerEpisodeList" class="playerEpisodeList"></div>
    </aside>
    <div id="playerStatus"></div>
  </section>
  <div id="toast"></div>
  <script src="hls.min.js"></script><script src="app.js"></script>
</body></html>
