<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; media-src * blob: data:; connect-src 'self' https: http://127.0.0.1:*; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Maxen</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="immersive.css">
</head>
<body>
  <header>
    <button class="brand" data-nav="home"><span class="brandMark">M</span><span>MAXEN</span></button>
    <nav><button data-nav="home" class="active">Keşfet</button><button data-nav="movie">Filmler</button><button data-nav="tv">Diziler</button><button data-nav="list">Listem</button><button data-nav="downloads">İndirilenler</button></nav>
    <form id="searchForm"><span class="searchIcon">⌕</span><input id="query" autocomplete="off" placeholder="Başlık, tür veya oyuncu ara"><kbd>Ctrl K</kbd><button aria-label="Ara">Ara</button></form>
    <div class="profile" title="Yerel profil">A</div>
    <div class="windowActions"><button data-window-action="minimize" aria-label="Simge durumuna küçült"><svg viewBox="0 0 20 20"><path d="M4 10h12"/></svg></button><button data-window-action="maximize" aria-label="Büyüt veya geri al"><svg viewBox="0 0 20 20"><rect x="4.5" y="4.5" width="11" height="11" rx="1"/></svg></button><button data-window-action="close" aria-label="Kapat"><svg viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15"/></svg></button></div>
  </header>
  <main id="app"><div class="loading"><i></i><span>Maxen hazırlanıyor</span></div></main>

  <section id="detail" class="detailPage" hidden><button class="close" data-close aria-label="Geri">←</button><div id="detailBody"></div></section>
  <section id="player" hidden>
    <video id="video" autoplay playsinline></video>
    <div class="playerTop"><button id="back" aria-label="Geri"><svg viewBox="0 0 24 24"><path d="M15.5 19 8.5 12l7-7"/></svg></button><div class="playerTopTitle"><strong id="playerTopTitle"></strong><span id="playerTopMeta"></span></div></div>
    <div class="playerControls">
      <div class="timeline"><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Video konumu"></div>
      <div class="controlBar">
        <div class="controlGroup"><button id="playToggle" aria-label="Oynat"><svg class="playIcon" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></svg><svg class="pauseIcon" viewBox="0 0 24 24"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg></button><button id="rewind" aria-label="10 saniye geri"><svg viewBox="0 0 28 28"><path d="M9 8H4V3M4.5 8.5A11 11 0 1 1 3 17"/><text x="9" y="18">10</text></svg></button><button id="forward" aria-label="10 saniye ileri"><svg viewBox="0 0 28 28"><path d="M19 8h5V3m-.5 5.5A11 11 0 1 0 25 17"/><text x="9" y="18">10</text></svg></button><button id="mute" aria-label="Sesi kapat"><svg class="soundOn" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10zm12-2a6 6 0 0 1 0 8m2-11a10 10 0 0 1 0 14"/></svg><svg class="soundOff" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10zm12-1 5 6m0-6-5 6"/></svg></button><input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Ses seviyesi"><span class="timeReadout"><span id="currentTime">00:00</span><span class="timeDivider"> / </span><span id="duration">00:00</span></span></div>
        <div class="nowPlaying"><strong id="playerTitle"></strong><span id="playerMeta"></span></div>
        <div class="playerActions"><span id="endTime" class="endTime"></span><button id="speedToggle" class="speedToggle" aria-label="Oynatma hızı: 1x" title="Oynatma hızı">1x</button><button id="qualityToggle" aria-label="Görüntü kalitesi" title="Görüntü kalitesi"><span id="qualityBadge">AUTO</span></button><button id="audioToggle" aria-label="Ses dili" title="Ses dili"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13M9 9l11-2"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></button><button id="subtitleToggle" aria-label="Altyazı" title="Altyazı"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M5 13h5m-5 3h4m4-3h6m-6 3h5"/></svg></button><button id="nextEpisode" aria-label="Sonraki bölüm" title="Sonraki bölüm"><svg viewBox="0 0 24 24"><path d="m6 5 10 7-10 7zm11 0h2v14h-2z"/></svg></button><button id="episodeMenu" aria-label="Bölümler" title="Bölümler"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button><button id="fitToggle" class="fitToggle" aria-label="Görüntüyü doldur" title="Görüntüyü sığdır / doldur"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M7 9h10v6H7z"/></svg></button><button id="fullscreen" aria-label="Tam ekrandan çık" title="Tam ekran"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M8 21H3v-5m13 5h5v-5"/></svg></button></div>
      </div>
      <div id="settingsPanel" class="settingsPanel" hidden><div id="audioSetting"><span>SES DİLİ</span><select id="source" aria-label="Ses dili"><option value="original">Orijinal yayın</option></select></div><div id="subtitleSetting"><span>ALTYAZI</span><select id="subtitle" aria-label="Altyazı"><option value="-1">Kapalı</option></select></div><div id="qualitySetting"><span>GÖRÜNTÜ KALİTESİ</span><select id="quality" aria-label="Görüntü kalitesi"><option value="-1">Otomatik</option></select></div></div>
    </div>
    <aside id="episodePanel" class="episodePanel" hidden>
      <div class="episodePanelHead"><div><span>BÖLÜMLER</span><strong id="episodePanelTitle"></strong></div><select id="playerSeasonSelect" aria-label="Sezon seç"></select><button id="closeEpisodePanel" aria-label="Bölümleri kapat">×</button></div>
      <div id="playerEpisodeList" class="playerEpisodeList"></div>
    </aside>
    <div id="playerStatus"></div>
  </section>
  <div id="downloadDialog" class="downloadOverlay" hidden>
    <section class="downloadDialog" role="dialog" aria-modal="true" aria-labelledby="downloadTitle">
      <button id="closeDownload" class="downloadClose" aria-label="Kapat">×</button>
      <span class="downloadKicker">ÇEVRİMDIŞI İZLE</span>
      <h2 id="downloadTitle">İndirme seçenekleri</h2>
      <p id="downloadMedia"></p>
      <label for="downloadAudio">Ses / dublaj <b>zorunlu</b></label>
      <select id="downloadAudio"><option value="">Ses seçin</option></select>
      <label for="downloadSubtitle">Altyazı <span>isteğe bağlı</span></label>
      <select id="downloadSubtitle"><option value="">Altyazı yok</option></select>
      <p id="downloadHint">Ses seçimini yaptıktan sonra indirmeyi başlatın.</p>
      <button id="confirmDownload" class="primary" disabled>İndir</button>
    </section>
  </div>
  <div id="deleteDialog" class="downloadOverlay" hidden><section class="deleteDialog" role="dialog" aria-modal="true" aria-labelledby="deleteTitle"><span class="deleteDialogIcon" aria-hidden="true">✕</span><h2 id="deleteTitle">İndirmeyi sil?</h2><p id="deleteDescription"></p><div class="deleteDialogActions"><button id="cancelDelete" class="secondary">Vazgeç</button><button id="confirmDelete" class="dangerButton">Dosyaları sil</button></div></section></div>
  <div id="toast"></div>
  <script src="hls.min.js"></script><script src="app.js"></script>
</body></html>
